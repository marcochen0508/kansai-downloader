<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5E8E" />
      <stop offset="50%" stop-color="#A832E8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Glass Glow Gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Arrow Gradient -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFE4EE" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.3" />
    </filter>
    
    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FFFFFF" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="url(#bgGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Inner Glass Layer -->
  <rect x="28" y="28" width="456" height="456" rx="98" ry="98" fill="url(#glowGrad)" />

  <!-- Sakura Petals Background Motif -->
  <g opacity="0.22" fill="#FFFFFF">
    <circle cx="160" cy="150" r="38" />
    <circle cx="352" cy="150" r="38" />
    <circle cx="120" cy="320" r="32" />
    <circle cx="392" cy="320" r="32" />
    <path d="M256,90 Q275,135 256,160 Q237,135 256,90 Z" />
  </g>

  <!-- Center Download Arrow & Tray Symbol -->
  <g filter="url(#innerGlow)">
    <!-- Download Arrow -->
    <path d="M256 120 C269.255 120 280 130.745 280 144 V260 L318.05 221.95 C327.423 212.577 342.627 212.577 352 221.95 C361.373 231.323 361.373 246.527 352 255.9 L272.97 334.93 C263.597 344.303 248.403 344.303 239.03 334.93 L160 255.9 C150.627 246.527 150.627 231.323 160 221.95 C169.373 212.577 184.577 212.577 193.95 221.95 L232 260 V144 C232 130.745 242.745 120 256 120 Z" fill="url(#arrowGrad)" />
    
    <!-- Base Download Bar / Tray -->
    <path d="M140 370 C140 356.745 150.745 346 164 346 H348 C361.255 346 372 356.745 372 370 C372 383.255 361.255 394 348 394 H164 C150.745 394 140 383.255 140 370 Z" fill="url(#arrowGrad)" />
  </g>

  <!-- Sakura Blossom Accent Badge (Top Right) -->
  <g transform="translate(350, 110) scale(0.65)">
    <path d="M 0,-40 C 12,-20 30,-30 40,0 C 20,12 30,30 0,40 C -12,20 -30,30 -40,0 C -20,-12 -30,-30 0,-40 Z" fill="#FFE4EE" opacity="0.9" />
    <circle cx="0" cy="0" r="10" fill="#FF5E8E" />
  </g>
</svg>
