<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 日本關西旅遊互助群 | 全平台影音下載導航神器</title>
    <meta name="description" content="專為日本關西旅遊互助群打造的社群影音圖文下載導航站。支援 IG、YouTube、TikTok、Threads、Facebook、小紅書等各大平台，免伺服器流量、秒速跳轉最穩定線上工具！">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;900&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Background Canvas / Sakura Atmosphere -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <div class="app-container">
        <!-- Header Section -->
        <header class="header">
            <div class="badge-pill">
                <span class="pulse-dot"></span>
                <span>🌸 日本關西旅遊互助群 專用神器</span>
            </div>
            <h1 class="main-title">
                全平台社群影音 <span class="gradient-text">下載導航站</span>
            </h1>
            <p class="subtitle">
                零伺服器限制・精選 100% 免費無毒下載通道・點選平台立即前往
            </p>
        </header>



        <!-- Search / Filter Helper Bar -->
        <div class="interactive-bar">
            <div class="search-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="platformSearch" placeholder="搜尋或篩選平台 (例如: IG, YouTube, 小紅書)...">
            </div>
            <div class="quick-status">
                <span class="status-indicator"></span>
                <span>所有導航通道狀態良好</span>
            </div>
        </div>

        <!-- Section: Select Platform -->
        <main class="platform-section">
            <div class="section-header">
                <span class="step-badge">步驟 1</span>
                <h3>選擇你要下載的社群平台</h3>
            </div>

            <div class="platform-grid" id="platformGrid">
                <!-- Platform Cards injected by JS -->
            </div>
        </main>

        <!-- Dynamic Destination Drawer / Modal -->
        <section class="destination-panel" id="destinationPanel" style="display: none;">
            <div class="panel-card">
                <div class="panel-header">
                    <div class="panel-title-group">
                        <div class="panel-icon" id="panelIcon">📸</div>
                        <div>
                            <h3 id="panelTitle">Instagram 下載通道推薦</h3>
                            <p id="panelDesc">精選目前線上最穩定、免註冊的專屬工具</p>
                        </div>
                    </div>
                    <button class="close-btn" id="closePanelBtn" title="關閉">&times;</button>
                </div>

                <div class="destination-grid" id="destinationGrid">
                    <!-- Dynamic Tool Buttons -->
                </div>

                <div class="panel-footer">
                    <div class="tip-box">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
                        <span>提示：點擊按鈕將在新分頁開啟該站點，貼上連結即可一鍵下載！</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-card">
                <p>🌸 <strong>日本關西旅遊互助群</strong> 專用導航系統</p>
                <p class="copyright">由群友共創維護・本站純屬導航服務・所有影音著作權屬原作者與各平台所有</p>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
