<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 日本關西旅遊互助群 | 全平台影音下載導航神器</title>
    <meta name="description" content="專為日本關西旅遊互助群打造的社群影音圖文下載導航站。支援 IG、YouTube、TikTok、Threads、Facebook、小紅書等各大平台，免伺服器流量、秒速跳轉最穩定線上工具！">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="shortcut icon" href="favicon.ico">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <!-- Background Canvas / Sakura Atmosphere -->
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <div class="app-container">
        <!-- Header Section -->
        <header class="header">
            <div class="header-top-row">
                <div class="badge-pill">
                    <span class="pulse-dot"></span>
                    <span>🌸 日本關西旅遊互助群 專用神器</span>
                </div>
                <button type="button" class="btn-header-install" id="btnHeaderInstall" style="display: none;">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>
                    <span>加到桌面</span>
                </button>
            </div>
            <h1 class="main-title">
                全平台社群影音 <span class="gradient-text">下載導航站</span>
            </h1>
            <p class="subtitle">
                零伺服器限制・精選 100% 免費無毒下載通道・點擊卡片立即直達
            </p>
        </header>



        <!-- Search / Filter Helper Bar -->
        <div class="interactive-bar">
            <div class="search-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" id="platformSearch" placeholder="搜尋或篩選平台 (例如: IG, YouTube, 小紅書)...">
            </div>
            <div class="quick-status">
                <span class="status-indicator"></span>
                <span>所有導航通道狀態良好</span>
            </div>
        </div>

        <!-- Section: Select Platform -->
        <main class="platform-section">
            <div class="section-header">
                <span class="step-badge">⚡ 一鍵直達</span>
                <h3>點選平台直接開啟下載站</h3>
            </div>

            <div class="platform-grid" id="platformGrid">
                <!-- Platform Cards injected by JS -->
            </div>
        </main>

        <!-- PWA Add to Home Screen Modal -->
        <div id="pwaModalOverlay" class="pwa-modal-overlay" style="display: none;">
            <div class="pwa-modal-card">
                <button type="button" class="pwa-modal-close" id="btnPwaClose">&times;</button>
                <div class="pwa-modal-header">
                    <img src="apple-touch-icon.png" class="pwa-modal-icon" alt="App Icon">
                    <h3>安裝「關西影音下載導航」</h3>
                    <p class="pwa-modal-desc">新增至手機主畫面或電腦桌面，享有獨立 App 沉浸體驗、秒開更方便！</p>
                </div>

                <!-- iOS Safari Guidance -->
                <div id="pwaIosGuide" class="pwa-guide-box" style="display: none;">
                    <div class="pwa-step-item">
                        <span class="pwa-step-num">1</span>
                        <div class="pwa-step-text">
                            點擊 Safari 底部工具列的 <strong>「分享」</strong> 圖示
                            <span class="pwa-inline-icon">
                                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
                            </span>
                        </div>
                    </div>
                    <div class="pwa-step-item">
                        <span class="pwa-step-num">2</span>
                        <div class="pwa-step-text">
                            在選單中向下滑動，選擇 <strong>「加入主畫面 ➕」</strong> 即可完成！
                        </div>
                    </div>
                </div>

                <!-- Android / Desktop Guidance -->
                <div id="pwaAndroidGuide" class="pwa-guide-box" style="display: none;">
                    <p>點擊下方按鈕即可一鍵新增至手機桌面或應用程式清單：</p>
                </div>

                <div class="pwa-modal-actions">
                    <button type="button" class="btn-pwa-action" id="btnPwaInstall">立即新增到桌面</button>
                    <button type="button" class="btn-pwa-dismiss" id="btnPwaDismiss">稍後再說</button>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <div class="footer-card">
                <p>🌸 <strong>日本關西旅遊互助群</strong> 專用導航系統</p>
                <p class="copyright">由群友共創維護・本站純屬導航服務・所有影音著作權屬原作者與各平台所有</p>
            </div>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
